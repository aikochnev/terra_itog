#cloud-config

package_update: true
package_upgrade: false

users:
  - name: ${username}
    groups: sudo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh-authorized-keys:
      - ${ssh_public_key}

packages:
  - ca-certificates
  - curl

runcmd:
  - |
      set -eux

      # Каталог для ключа Docker
      install -m 0755 -d /etc/apt/keyrings

      # Официальный GPG-ключ Docker
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc

      chmod a+r /etc/apt/keyrings/docker.asc

      # Определяем кодовое имя Ubuntu: jammy, noble и т. д.
      . /etc/os-release

      # Подключаем официальный репозиторий Docker
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" \
        > /etc/apt/sources.list.d/docker.list

      # Устанавливаем Docker Engine и плагины Buildx / Compose v2
      apt-get update
      apt-get install -y \
        docker-ce \
        docker-ce-cli \
        containerd.io \
        docker-buildx-plugin \
        docker-compose-plugin

      # Запускаем Docker и включаем автозапуск
      systemctl enable --now docker

      # Разрешаем пользователю использовать Docker без sudo
      usermod -aG docker ${username}

      # Контрольная запись версий
      docker --version > /var/log/docker-install.log
      docker compose version >> /var/log/docker-install.log